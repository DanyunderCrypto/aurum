name: Atualizar indice de spam (D1)

# Quando corre:
#   - Manualmente (botao "Run workflow" no separador Actions) -> usa isto para o 1o seed.
#   - Automaticamente, todas as segundas as 04:00 UTC.
on:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * 1'

# Evita duas execucoes ao mesmo tempo (que se pisariam no snapshot).
concurrency:
  group: spam-refresh
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout do repo
        uses: actions/checkout@v4

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Clonar listas GoldRush (shallow)
        run: git clone --depth 1 https://github.com/covalenthq/goldrush-enhanced-spam-lists.git goldrush

      - name: Restaurar snapshot da semana passada
        uses: actions/cache@v4
        with:
          path: spam-index/snapshot.txt
          key: spam-snapshot-${{ github.run_id }}
          restore-keys: |
            spam-snapshot-

      - name: ETL (parse + diff + gerar SQL)
        run: node spam-index/spam-etl.js
        env:
          SRC_DIR: goldrush/src/lists/erc20
          OUT_DIR: spam-index/sql_out
          SNAPSHOT_IN: spam-index/snapshot.txt
          SNAPSHOT_OUT: spam-index/snapshot.txt
          SRC_NAME: goldrush

      - name: Carregar SQL no D1 (remoto)
        working-directory: spam-index
        run: |
          shopt -s nullglob
          files=(sql_out/seed_*.sql)
          if [ ${#files[@]} -eq 0 ]; then
            echo "Sem contratos novos esta semana. Nada a carregar."
            exit 0
          fi
          echo "A carregar ${#files[@]} ficheiro(s) para o D1..."
          for f in "${files[@]}"; do
            echo ">> $f"
            npx --yes wrangler@4 d1 execute spam_index --remote --file="$f"
          done
          echo "Concluido."
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: d74524d1291ed85ca0b3e8c26cfcffa9
